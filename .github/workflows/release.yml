name: Release UTP Multi-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Compile UTP CLI & Daemon
        shell: msys2 {0}
        run: |
          g++ -std=c++20 -O3 -s -D_WIN32_WINNT=0x0A00 -I core/include -I . \
            cli/main.cpp cli/tui.cpp cli/stream_server.cpp \
            core/src/chunk_planner.cpp core/src/engine.cpp core/src/state_manager.cpp core/src/uri_parser.cpp \
            core/src/sync_engine.cpp core/src/multi_engine.cpp core/src/routing_rules.cpp \
            providers/azure/azure_provider.cpp providers/common/http_client.cpp \
            providers/dropbox/dropbox_provider.cpp providers/google_drive/gdrive_provider.cpp \
            providers/http/http_provider.cpp providers/icloud/icloud_provider.cpp providers/local/local_provider.cpp \
            providers/onedrive/onedrive_provider.cpp providers/s3/s3_provider.cpp \
            providers/webdav/webdav_provider.cpp \
            -o utp.exe -lcurl -lssl -lcrypto -lws2_32 -lsqlite3

          g++ -std=c++20 -O3 -s -D_WIN32_WINNT=0x0A00 -I core/include -I . -I server \
            server/main.cpp \
            core/src/chunk_planner.cpp core/src/engine.cpp core/src/state_manager.cpp core/src/uri_parser.cpp \
            providers/azure/azure_provider.cpp providers/common/http_client.cpp \
            providers/dropbox/dropbox_provider.cpp providers/google_drive/gdrive_provider.cpp \
            providers/http/http_provider.cpp providers/icloud/icloud_provider.cpp providers/local/local_provider.cpp \
            providers/onedrive/onedrive_provider.cpp providers/s3/s3_provider.cpp \
            providers/webdav/webdav_provider.cpp \
            -o utpd.exe -lcurl -lssl -lcrypto -lws2_32 -lsqlite3

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path utp.exe, utpd.exe, LICENSE, README.md, PRIVACY.md, SECURITY.md -DestinationPath utp-windows-x64.zip

      - name: Upload Windows Asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: utp-windows-x64
          path: utp-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev libsqlite3-dev

      - name: Compile UTP CLI & Daemon
        run: |
          g++ -std=c++20 -O3 -I core/include -I . \
            cli/main.cpp cli/tui.cpp cli/stream_server.cpp \
            core/src/chunk_planner.cpp core/src/engine.cpp core/src/state_manager.cpp core/src/uri_parser.cpp \
            core/src/sync_engine.cpp core/src/multi_engine.cpp core/src/routing_rules.cpp \
            providers/azure/azure_provider.cpp providers/common/http_client.cpp \
            providers/dropbox/dropbox_provider.cpp providers/google_drive/gdrive_provider.cpp \
            providers/http/http_provider.cpp providers/icloud/icloud_provider.cpp providers/local/local_provider.cpp \
            providers/onedrive/onedrive_provider.cpp providers/s3/s3_provider.cpp \
            providers/webdav/webdav_provider.cpp \
            -o utp -lcurl -lssl -lcrypto -lpthread -lsqlite3

          g++ -std=c++20 -O3 -I core/include -I . -I server \
            server/main.cpp \
            core/src/chunk_planner.cpp core/src/engine.cpp core/src/state_manager.cpp core/src/uri_parser.cpp \
            providers/azure/azure_provider.cpp providers/common/http_client.cpp \
            providers/dropbox/dropbox_provider.cpp providers/google_drive/gdrive_provider.cpp \
            providers/http/http_provider.cpp providers/icloud/icloud_provider.cpp providers/local/local_provider.cpp \
            providers/onedrive/onedrive_provider.cpp providers/s3/s3_provider.cpp \
            providers/webdav/webdav_provider.cpp \
            -o utpd -lcurl -lssl -lcrypto -lpthread -lsqlite3

          g++ -std=c++20 -O3 -I core/include -I . \
            tests/test_runner.cpp \
            core/src/chunk_planner.cpp core/src/engine.cpp core/src/state_manager.cpp core/src/uri_parser.cpp \
            core/src/sync_engine.cpp core/src/multi_engine.cpp core/src/routing_rules.cpp \
            providers/common/http_client.cpp providers/local/local_provider.cpp providers/http/http_provider.cpp \
            -o test_runner -lcurl -lssl -lcrypto -lpthread -lsqlite3
          ./test_runner
          rm -f test_runner utp.db

      - name: Package Linux tar.gz
        run: |
          tar -czvf utp-linux-x64.tar.gz utp utpd LICENSE README.md PRIVACY.md SECURITY.md

      - name: Upload Linux Asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: utp-linux-x64
          path: utp-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          brew install openssl sqlite

      - name: Compile UTP CLI & Daemon
        run: |
          clang++ -std=c++20 -O3 -I core/include -I . \
            -I$(brew --prefix openssl)/include -L$(brew --prefix openssl)/lib \
            -I$(brew --prefix sqlite)/include -L$(brew --prefix sqlite)/lib \
            cli/main.cpp cli/tui.cpp cli/stream_server.cpp \
            core/src/chunk_planner.cpp core/src/engine.cpp core/src/state_manager.cpp core/src/uri_parser.cpp \
            core/src/sync_engine.cpp core/src/multi_engine.cpp core/src/routing_rules.cpp \
            providers/azure/azure_provider.cpp providers/common/http_client.cpp \
            providers/dropbox/dropbox_provider.cpp providers/google_drive/gdrive_provider.cpp \
            providers/http/http_provider.cpp providers/icloud/icloud_provider.cpp providers/local/local_provider.cpp \
            providers/onedrive/onedrive_provider.cpp providers/s3/s3_provider.cpp \
            providers/webdav/webdav_provider.cpp \
            -o utp -lcurl -lssl -lcrypto -lpthread -lsqlite3

          clang++ -std=c++20 -O3 -I core/include -I . -I server \
            -I$(brew --prefix openssl)/include -L$(brew --prefix openssl)/lib \
            -I$(brew --prefix sqlite)/include -L$(brew --prefix sqlite)/lib \
            server/main.cpp \
            core/src/chunk_planner.cpp core/src/engine.cpp core/src/state_manager.cpp core/src/uri_parser.cpp \
            providers/azure/azure_provider.cpp providers/common/http_client.cpp \
            providers/dropbox/dropbox_provider.cpp providers/google_drive/gdrive_provider.cpp \
            providers/http/http_provider.cpp providers/icloud/icloud_provider.cpp providers/local/local_provider.cpp \
            providers/onedrive/onedrive_provider.cpp providers/s3/s3_provider.cpp \
            providers/webdav/webdav_provider.cpp \
            -o utpd -lcurl -lssl -lcrypto -lpthread -lsqlite3

      - name: Package macOS tar.gz
        run: |
          tar -czvf utp-macos.tar.gz utp utpd LICENSE README.md PRIVACY.md SECURITY.md

      - name: Upload macOS Asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: utp-macos
          path: utp-macos.tar.gz

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Generate SHA-256 Checksums
        run: |
          (cd utp-windows-x64 && sha256sum utp-windows-x64.zip) > SHA256SUMS.txt
          (cd utp-linux-x64 && sha256sum utp-linux-x64.tar.gz) >> SHA256SUMS.txt
          (cd utp-macos && sha256sum utp-macos.tar.gz) >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            utp-windows-x64/utp-windows-x64.zip
            utp-linux-x64/utp-linux-x64.tar.gz
            utp-macos/utp-macos.tar.gz
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

  update-packaging:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: PROJECTS

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Stamp verified SHA-256 checksums into packaging manifests
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          WIN_SHA=$(sha256sum utp-windows-x64/utp-windows-x64.zip | awk '{print $1}')
          LINUX_SHA=$(sha256sum utp-linux-x64/utp-linux-x64.tar.gz | awk '{print $1}')
          MAC_SHA=$(sha256sum utp-macos/utp-macos.tar.gz | awk '{print $1}')
          export VERSION WIN_SHA LINUX_SHA MAC_SHA
          python3 - << 'EOF'
          import json, os, re, textwrap

          ver = os.environ["VERSION"]
          win_sha = os.environ["WIN_SHA"]
          linux_sha = os.environ["LINUX_SHA"]
          mac_sha = os.environ["MAC_SHA"]

          # 1. Scoop manifest
          with open("packaging/scoop/utp.json", "r", encoding="utf-8") as f:
              scoop = json.load(f)
          scoop["version"] = ver
          scoop["architecture"]["64bit"]["url"] = (
              f"https://github.com/ARPIT-NAYAK-LEGEND/Cloud-Transfer-Protocol/releases/download/v{ver}/utp-windows-x64.zip"
          )
          scoop["architecture"]["64bit"]["hash"] = win_sha
          with open("packaging/scoop/utp.json", "w", encoding="utf-8") as f:
              json.dump(scoop, f, indent=2)
              f.write("\n")

          # 2. Pacman PKGBUILD
          with open("packaging/pacman/PKGBUILD", "r", encoding="utf-8") as f:
              pkg = f.read()
          pkg = re.sub(r'^pkgver=.*$', f'pkgver={ver}', pkg, flags=re.M)
          pkg = re.sub(r"^sha256sums_x86_64=\(.*\)$", f"sha256sums_x86_64=('{linux_sha}')", pkg, flags=re.M)
          with open("packaging/pacman/PKGBUILD", "w", encoding="utf-8") as f:
              f.write(pkg)

          # 3. Homebrew formula binary block / version
          rb = textwrap.dedent(f'''\
          class Utp < Formula
            desc "Universal Cloud Transfer Protocol (UTP) - Direct 0-Disk High-Speed Cloud-to-Cloud Pipeline"
            homepage "https://github.com/ARPIT-NAYAK-LEGEND/Cloud-Transfer-Protocol"
            version "{ver}"
            license "MIT"

            on_macos do
              url "https://github.com/ARPIT-NAYAK-LEGEND/Cloud-Transfer-Protocol/releases/download/v{ver}/utp-macos.tar.gz"
              sha256 "{mac_sha}"
            end

            on_linux do
              url "https://github.com/ARPIT-NAYAK-LEGEND/Cloud-Transfer-Protocol/releases/download/v{ver}/utp-linux-x64.tar.gz"
              sha256 "{linux_sha}"
            end

            depends_on "curl"
            depends_on "openssl@3"
            depends_on "sqlite"

            def install
              bin.install "utp"
              bin.install "utpd"
            end

            test do
              system "#{{bin}}/utp", "--help"
            end
          end
          ''')
          with open("packaging/homebrew/utp.rb", "w", encoding="utf-8") as f:
              f.write(rb)
          EOF

      - name: Commit updated packaging checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/
          if ! git diff --cached --quiet; then
            git commit -m "chore(packaging): stamp verified SHA-256 checksums for ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:PROJECTS
          fi

  publish-npm:
    needs: [build-windows, build-linux, build-macos, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build & Test TypeScript SDK
        run: |
          cd sdk/typescript
          npm install
          npm run build
          npm test

      - name: Verify npm packages
        run: |
          cd sdk/typescript && npm pack --dry-run
          cd ../../npm && npm pack --dry-run

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            (cd npm && npm publish --access public)
            npm deprecate "utp-engine@<${TAG_VER}" "Security update: embedded obsolete binary removed; upgrade to >=${TAG_VER}" || true
            (cd sdk/typescript && npm publish --access public) || echo "Note: @utp/client scope publish skipped (check npm org scope)"
          else
            echo "NPM_TOKEN secret not present; skipping npm publish"
          fi
